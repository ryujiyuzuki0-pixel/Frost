# Reforged Frost - ItemsAdder setup (Netherite base)
# Copy into plugins/ItemsAdder/contents/reforged_frost/configs/ then run /iazip
#
# HELMET  : uses the native 'item_model' option (ItemsAdder 1.21.4+ modern items).
# OTHERS  : ItemsAdder has no native option for an external equipment asset, so the
#           chest/legs/boots set the vanilla equippable component through the
#           third-party addon ItemsAdderAdditions ('components:' section).
#           Without that addon those three pieces will not show the 3D armor.
info:
  namespace: reforged_frost

items:
  frost_netherite_helmet:
    name: "&l&#C8C4E0Reforged Frost &fHelmet"
    material: NETHERITE_HELMET
    item_model: mythicarmor:reforged_frost_armor_head_piece
    equipment:
      slot_attribute_modifiers:
        armor: 3

  frost_netherite_chestplate:
    name: "&l&#C8C4E0Reforged Frost &fChestplate"
    material: NETHERITE_CHESTPLATE
    equipment:
      slot_attribute_modifiers:
        armor: 8
    components:
      minecraft:equippable:
        slot: chest
        asset_id: "mythicarmor:reforged_frost_armor_chest_piece"

  frost_netherite_leggings:
    name: "&l&#C8C4E0Reforged Frost &fLeggings"
    material: NETHERITE_LEGGINGS
    equipment:
      slot_attribute_modifiers:
        armor: 6
    components:
      minecraft:equippable:
        slot: legs
        asset_id: "mythicarmor:reforged_frost_armor_legs_piece"

  frost_netherite_boots:
    name: "&l&#C8C4E0Reforged Frost &fBoots"
    material: NETHERITE_BOOTS
    equipment:
      slot_attribute_modifiers:
        armor: 3
    components:
      minecraft:equippable:
        slot: feet
        asset_id: "mythicarmor:reforged_frost_armor_feet_piece"

