# Copy bundled model into plugins/MythicArmors/models/ on startup
# and run "ma reload" if it was added/changed.
install-model: true

# Used when /frost give doesn't specify leather/netherite
default-base: netherite

# Optional built-in resource pack host. Serves the pack MythicArmors generates.
# Off by default. If you use Nexo/Oraxen/ItemsAdder pack hosting, leave this off
# and merge plugins/MythicArmors/pack.zip into their pack instead.
pack:
  enabled: false
  port: 8123
  # What players download from. Must be reachable from the internet.
  public-url: "http://YOUR_IP:8123/pack.zip"
  # Path relative to the plugins folder
  file: "MythicArmors/pack.zip"
  required: false
  prompt: "<#C8C4E0>Reforged Frost resource pack"

# Armor set bonuses (amplifier 0 = Speed I, 1 = Speed II)
set-bonus:
  # 1-3 pieces worn
  partial-speed-amplifier: 0
  # all 4 pieces worn
  full-speed-amplifier: 1
  # all 4 pieces worn: fraction of damage removed (0.05 = 5%, 0 = off)
  full-damage-reduction: 0.05
